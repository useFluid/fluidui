name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Version from the release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "The release tag must look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "FLUID_VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV" ;; *) echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;; esac
      - run: node scripts/build-packages.mjs
      - run: npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/motion/dist
      - run: npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/cli/dist
